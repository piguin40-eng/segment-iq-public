name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -r requirements-geometry.txt
      - run: python -m pytest -q tests commercial/test_readiness.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/dictation_ui.test.cjs desktop/test/policy.test.cjs
